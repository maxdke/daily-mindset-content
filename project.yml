name: DailyMindset
options:
  bundleIdPrefix: com.maxdeike.dailymindset
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: "" # <-- Trage hier deine Apple Developer Team-ID ein

packages: {}

targets:
  DailyMindset:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxdeike.dailymindset
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/DailyMindset.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Daily Mindset
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.maxdeike.dailymindset.refresh
    entitlements:
      path: App/DailyMindset.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maxdeike.dailymindset
    dependencies:
      - target: MindsetWidgetExtension
        embed: true

  MindsetWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MindsetWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxdeike.dailymindset.widget
        INFOPLIST_FILE: MindsetWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MindsetWidget/MindsetWidget.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: MindsetWidget/Info.plist
      properties:
        CFBundleDisplayName: Daily Mindset Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MindsetWidget/MindsetWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maxdeike.dailymindset

schemes:
  DailyMindset:
    build:
      targets:
        DailyMindset: all
        MindsetWidgetExtension: all
    run:
      config: Debug
      storeKitConfiguration: Config/Subscriptions.storekit
    archive:
      config: Release
